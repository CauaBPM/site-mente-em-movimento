# Publica uma PRÉVIA do site no GitHub Pages a cada push na branch main.
# A prévia sai com noindex (não aparece no Google) e em subcaminho:
#   https://<usuario>.github.io/<repositorio>/
# A publicação definitiva (domínio da clínica) segue o README, seção 7.
#
# Segurança da automação:
# - Actions fixadas pelo SHA do commit (a tag correspondente fica no comentário);
#   ao atualizar, troque o SHA junto com o comentário.
# - Permissões mínimas por job: o build só lê o repositório; só o deploy escreve no Pages.
# - `npm ci --ignore-scripts`: nenhum script de instalação de dependência é executado
#   (o projeto não precisa deles: sharp e esbuild usam binários pré-compilados).
# - O site é verificado (links, CSP, termos proibidos) antes de ser publicado.
name: Prévia no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verificação (build padrão)
        run: npm run build && npm run verificar
      - name: Build da prévia
        run: npm run build && npm run verificar
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_PREVIEW: 'true'
          HOSPEDAGEM: github-pages
          VERIFICAR_SO_SEGURANCA: 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
